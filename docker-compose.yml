services:
  app:
    build: .
    # 添加这个策略
    pull_policy: never
    image: aqua-chroma
    container_name: aqua-chroma-app
    restart: unless-stopped
    ports:
      - "8010:8000"
    volumes:
      - aqua-chroma-data:/app/data
    env_file:
      - .env    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"  # 单个文件最大 10MB
        max-file: "3"    # 最多保留 3 个归档文件

volumes:
  aqua-chroma-data:
